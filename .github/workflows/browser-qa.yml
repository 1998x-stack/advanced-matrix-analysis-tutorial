name: Browser QA (illustrated lessons)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/validate_site.py
      - run: python scripts/test_examples.py
      - run: python scripts/build_site.py
      - run: python scripts/browser_qa.py --output qa/batch-16-20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illustrated-browser-qa
          path: qa/batch-11-15/
          retention-days: 14
