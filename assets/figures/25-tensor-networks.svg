<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="tn-title tn-desc"><title id="tn-title">三种张量网络的图结构：TT 链、TR 环、HT 树</title><desc id="tn-desc">左：Tensor-Train 是线性链，节点依次相连，两端节点只有一个连接边（边界效应）。中：Tensor-Ring 把链首尾相连成环，所有节点连接数相等。右：Hierarchical Tucker 是二叉树，叶节点是原始维度，内部节点是合并后的核心张量。</desc><rect width="900" height="300" rx="14" fill="#fffdf9" stroke="#dce3df"/>
<text x="30" y="36" font-size="15" fill="#147f80" font-family="sans-serif">Tensor-Train（链）</text>
<g stroke="#53676d" stroke-width="1.6"><line x1="60" y1="150" x2="150" y2="150"/><line x1="170" y1="150" x2="260" y2="150"/><line x1="60" y1="140" x2="60" y2="100"/><line x1="115" y1="140" x2="115" y2="100"/><line x1="205" y1="140" x2="205" y2="100"/><line x1="260" y1="140" x2="260" y2="100"/></g>
<circle cx="60" cy="150" r="10" fill="#e8f4f2" stroke="#147f80" stroke-width="1.8"/><circle cx="160" cy="150" r="10" fill="#e8f4f2" stroke="#147f80" stroke-width="1.8"/><circle cx="205" cy="150" r="10" fill="#e8f4f2" stroke="#147f80" stroke-width="1.8"/><circle cx="305" cy="150" r="10" fill="#e8f4f2" stroke="#147f80" stroke-width="1.8"/>
<text x="30" y="196" font-size="13" fill="#53676d" font-family="sans-serif">两端节点只连 1 条内部边 → 边界效应</text>
<text x="30" y="220" font-size="13" fill="#53676d" font-family="sans-serif">开放边 = 自由索引；核心为 3 阶（两端为 2 阶）</text>
<line x1="330" y1="60" x2="330" y2="260" stroke="#dce3df" stroke-width="1.5"/>
<text x="350" y="36" font-size="15" fill="#7461ba" font-family="sans-serif">Tensor-Ring（环）</text>
<g stroke="#53676d" stroke-width="1.6"><line x1="410" y1="140" x2="490" y2="96"/><line x1="500" y1="96" x2="580" y2="140"/><line x1="580" y1="160" x2="500" y2="204"/><line x1="490" y1="204" x2="410" y2="160"/><line x1="410" y1="150" x2="360" y2="150"/><line x1="580" y1="150" x2="630" y2="150"/><line x1="450" y1="125" x2="450" y2="90"/><line x1="540" y1="125" x2="540" y2="90"/></g>
<circle cx="410" cy="150" r="10" fill="#efeaf8" stroke="#7461ba" stroke-width="1.8"/><circle cx="495" cy="96" r="10" fill="#efeaf8" stroke="#7461ba" stroke-width="1.8"/><circle cx="580" cy="150" r="10" fill="#efeaf8" stroke="#7461ba" stroke-width="1.8"/><circle cx="495" cy="204" r="10" fill="#efeaf8" stroke="#7461ba" stroke-width="1.8"/>
<text x="350" y="240" font-size="13" fill="#53676d" font-family="sans-serif">首尾相连：所有核心均为 3 阶，边界效应减弱</text>
<line x1="660" y1="60" x2="660" y2="260" stroke="#dce3df" stroke-width="1.5"/>
<text x="680" y="36" font-size="15" fill="#c66345" font-family="sans-serif">Hierarchical Tucker（树）</text>
<g stroke="#53676d" stroke-width="1.6"><line x1="770" y1="80" x2="710" y2="140"/><line x1="770" y1="80" x2="830" y2="140"/><line x1="710" y1="150" x2="680" y2="210"/><line x1="710" y1="150" x2="740" y2="210"/><line x1="830" y1="150" x2="800" y2="210"/><line x1="830" y1="150" x2="860" y2="210"/></g>
<circle cx="770" cy="75" r="9" fill="#f6e8dc" stroke="#c66345" stroke-width="1.8"/><circle cx="710" cy="150" r="9" fill="#f6e8dc" stroke="#c66345" stroke-width="1.8"/><circle cx="830" cy="150" r="9" fill="#f6e8dc" stroke="#c66345" stroke-width="1.8"/><circle cx="680" cy="220" r="8" fill="#fff" stroke="#53676d" stroke-width="1.6"/><circle cx="740" cy="220" r="8" fill="#fff" stroke="#53676d" stroke-width="1.6"/><circle cx="800" cy="220" r="8" fill="#fff" stroke="#53676d" stroke-width="1.6"/><circle cx="860" cy="220" r="8" fill="#fff" stroke="#53676d" stroke-width="1.6"/>
<text x="680" y="256" font-size="13" fill="#53676d" font-family="sans-serif">叶=原始维度，内部节点=核心；</text>
<text x="680" y="278" font-size="13" fill="#53676d" font-family="sans-serif">递归二分，适合层次化/多尺度数据。</text></svg>
