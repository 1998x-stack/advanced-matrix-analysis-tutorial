<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="stiefel-title stiefel-desc"><title id="stiefel-title">Stiefel 记录正交标架，Grassmann 只记录列空间</title><desc id="stiefel-desc">同一二维子空间可由 X 和 XQ 两组正交基表示；Stiefel 将它们视为不同点，Grassmann 将它们识别为同一个子空间。</desc><defs><marker id="stiefel-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="18" fill="#f5f9f6"/><rect x="27" y="75" width="416" height="306" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="477" y="75" width="416" height="306" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><text x="50" y="50" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#147f80">Stiefel：正交标架 X</text><text x="501" y="50" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#c66345">Grassmann：列空间 span(X)</text><path d="M92 300 L357 300 L316 145 Z" fill="#e5f1ec" stroke="#9dbdb0" stroke-width="2"/><path d="M215 300 L150 204 M215 300 L320 200" stroke="#147f80" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M542 300 L807 300 L766 145 Z" fill="#e5f1ec" stroke="#9dbdb0" stroke-width="2"/><path d="M665 300 L610 202 M665 300 L735 200" stroke="#147f80" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M665 300 L735 200 M665 300 L760 247" stroke="#c66345" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="217" y="183" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">x₁, x₂</text><text x="665" y="183" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">X</text><text x="744" y="235" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#c66345">XQ</text><text x="50" y="344" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">XᵀX=I；旋转列基会改变 Stiefel 点</text><text x="500" y="344" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">X 与 XQ 表示同一个 p 维子空间</text><text x="30" y="414" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">Grassmann = Stiefel / O(p)：忽略基底的旋转；距离应比较子空间（主角），而非逐列比较向量。</text></svg>