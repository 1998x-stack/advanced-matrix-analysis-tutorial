<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="unf-title unf-desc"><title id="unf-title">三阶张量 T∈R^{2×3×2} 的模-1展开</title><desc id="unf-desc">左：三阶张量 T 的两个 frontal slice，T(:,:,1)=[[1,2,3],[4,5,6]]、T(:,:,2)=[[7,8,9],[10,11,12]]。中：模-1展开把每个第 1 维固定的纤维按字典序排成列。右：结果 T_(1)∈R^{2×6}，前 3 列来自第一切片（青），后 3 列来自第二切片（珊瑚）。</desc><rect width="900" height="400" rx="14" fill="#fffdf9" stroke="#dce3df"/>
<text x="40" y="44" font-size="15" fill="#203035" font-family="sans-serif">张量 T ∈ R²ˣ³ˣ²：两个 2×3 切片</text>
<text x="40" y="64" font-size="13" fill="#53676d" font-family="sans-serif">T(:,:,1)</text>
<rect x="40" y="72" width="120" height="80" fill="#e8f4f2" stroke="#203035" stroke-width="1.4"/>
<line x1="80" y1="72" x2="80" y2="152" stroke="#203035"/><line x1="120" y1="72" x2="120" y2="152" stroke="#203035"/><line x1="40" y1="112" x2="160" y2="112" stroke="#203035"/>
<g font-size="14" fill="#203035" font-family="sans-serif" text-anchor="middle"><text x="60" y="97">1</text><text x="100" y="97">2</text><text x="140" y="97">3</text><text x="60" y="137">4</text><text x="100" y="137">5</text><text x="140" y="137">6</text></g>
<text x="190" y="64" font-size="13" fill="#53676d" font-family="sans-serif">T(:,:,2)</text>
<rect x="190" y="72" width="120" height="80" fill="#fbf2ed" stroke="#203035" stroke-width="1.4"/>
<line x1="230" y1="72" x2="230" y2="152" stroke="#203035"/><line x1="270" y1="72" x2="270" y2="152" stroke="#203035"/><line x1="190" y1="112" x2="310" y2="112" stroke="#203035"/>
<g font-size="14" fill="#203035" font-family="sans-serif" text-anchor="middle"><text x="210" y="97">7</text><text x="250" y="97">8</text><text x="290" y="97">9</text><text x="210" y="137">10</text><text x="250" y="137">11</text><text x="290" y="137">12</text></g>
<line x1="340" y1="112" x2="392" y2="112" stroke="#147f80" stroke-width="2" marker-end="url(#ar23)"/>
<text x="330" y="98" font-size="13" fill="#147f80" font-family="sans-serif">模-1展开</text>
<text x="420" y="44" font-size="15" fill="#203035" font-family="sans-serif">T₍₁₎ ∈ R²ˣ⁶：行=第 1 维，列=其余维字典序</text>
<rect x="420" y="72" width="240" height="80" fill="#fff" stroke="#203035" stroke-width="1.4"/>
<line x1="460" y1="72" x2="460" y2="152" stroke="#203035"/><line x1="500" y1="72" x2="500" y2="152" stroke="#203035"/><line x1="540" y1="72" x2="540" y2="152" stroke="#203035"/><line x1="580" y1="72" x2="580" y2="152" stroke="#203035"/><line x1="620" y1="72" x2="620" y2="152" stroke="#203035"/><line x1="420" y1="112" x2="660" y2="112" stroke="#203035"/>
<g font-size="14" fill="#203035" font-family="sans-serif" text-anchor="middle"><text x="440" y="97">1</text><text x="480" y="97">2</text><text x="520" y="97">3</text><text x="560" y="97">7</text><text x="600" y="97">8</text><text x="640" y="97">9</text><text x="440" y="137">4</text><text x="480" y="137">5</text><text x="520" y="137">6</text><text x="560" y="137">10</text><text x="600" y="137">11</text><text x="640" y="137">12</text></g>
<rect x="420" y="72" width="120" height="80" fill="#e8f4f2" opacity="0.35"/><rect x="540" y="72" width="120" height="80" fill="#fbf2ed" opacity="0.35"/>
<text x="420" y="176" font-size="13" fill="#147f80" font-family="sans-serif">前 3 列 ← 切片 1</text><text x="560" y="176" font-size="13" fill="#c66345" font-family="sans-serif">后 3 列 ← 切片 2</text>
<line x1="40" y1="206" x2="860" y2="206" stroke="#dce3df"/>
<text x="40" y="238" font-size="14" fill="#203035" font-family="sans-serif">一般规则：T₍ₙ₎ ∈ R^{ Iₙ × (其余维乘积) }，行数永远是第 n 维大小。</text>
<text x="40" y="264" font-size="14" fill="#53676d" font-family="sans-serif">本例：模-2展开 → 3×4；模-3展开 → 2×6（与模-1的行数巧合相同，但列排布不同）。</text>
<text x="40" y="296" font-size="14" fill="#147f80" font-family="sans-serif">可验证观察：无论展开哪个模，元素总和恒为 78，平方和恒为 650。</text>
<text x="40" y="330" font-size="14" fill="#c66345" font-family="sans-serif">注意：展开只重排元素位置，不改变数值；不同模展开对应不同的矩阵秩。</text>
<defs><marker id="ar23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs></svg>
