<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="mnf-title mnf-desc"><title id="mnf-title">在球面上先走再投影，与沿测地线走一步的结果不同</title><desc id="mnf-desc">单位圆表示 Stiefel 流形 St(1,2)。从点 X 沿切方向 ξ 走一步到 Y=X+ηξ，再径向投影回圆周得到 Π(Y)；沿测地线（圆弧）走同样的切向量得到 Exp_X(ηξ)。两者一阶相同，但从二阶起分离。</desc><rect width="780" height="410" rx="14" fill="#fffdf9" stroke="#dce3df"/>
<circle cx="260" cy="220" r="140" fill="#e8f4f2" stroke="#147f80" stroke-width="2"/>
<circle cx="260" cy="220" r="3" fill="#53676d"/>
<line x1="24.2" y1="283.2" x2="281.4" y2="-23.2" stroke="#53676d" stroke-width="1.2" stroke-dasharray="6 5"/>
<polyline points="152.8,130 170,112.8 190,98.8 212.1,88.4 235.7,82.1 247.8,80.5" fill="none" stroke="#147f80" stroke-width="2.8"/>
<line x1="152.8" y1="130" x2="223.5" y2="45.7" stroke="#7461ba" stroke-width="2.4"/>
<path d="M223.5 45.7 L215 50 M223.5 45.7 L219 55" stroke="#7461ba" stroke-width="2" fill="none"/>
<line x1="223.5" y1="45.7" x2="231.3" y2="83" stroke="#c66345" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="152.8" cy="130" r="5.5" fill="#c66345"/>
<circle cx="223.5" cy="45.7" r="5.5" fill="#7461ba"/>
<circle cx="231.3" cy="83" r="5.5" fill="#c66345"/>
<circle cx="247.8" cy="80.5" r="5.5" fill="#147f80"/>
<text x="128" y="126" font-size="15" fill="#c66345" font-family="sans-serif">X</text>
<text x="232" y="42" font-size="14" fill="#7461ba" font-family="sans-serif">Y = X+ηξ</text>
<text x="240" y="92" font-size="14" fill="#c66345" font-family="sans-serif">Π(Y)</text>
<text x="256" y="76" font-size="14" fill="#147f80" font-family="sans-serif">Exp_X(ηξ)</text>
<text x="40" y="330" font-size="14" fill="#53676d" font-family="sans-serif">虚线：切空间 T_X M</text>
<text x="40" y="352" font-size="14" fill="#53676d" font-family="sans-serif">紫：沿切方向 ξ 到 Y；橙：投影回流形；青：沿测地线</text>
<text x="430" y="70" font-size="15" fill="#203035" font-family="sans-serif">一阶等价，二阶分离</text>
<text x="430" y="98" font-size="14" fill="#53676d" font-family="sans-serif">两者切向量都是 ξ，</text>
<text x="430" y="120" font-size="14" fill="#53676d" font-family="sans-serif">差别来自“如何回到流形”。</text></svg>
