<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" role="img" aria-labelledby="qz-title qz-desc"><title id="qz-title">广义特征值比值 alpha/beta 与无穷远特征值</title><desc id="qz-desc">正规矩阵束 A=diag(2,3), B=diag(1,0)，齐次特征值为 (alpha,beta)=(2,1) 与 (3,0)；第二个对应无穷远特征值。</desc><defs><marker id="qz-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="425" rx="18" fill="#f6faf8"/><text x="31" y="44" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035">矩阵束 A−λB：B 奇异时，不能使用 B⁻¹A 取代广义问题。</text><rect x="26" y="72" width="280" height="306" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="331" y="72" width="263" height="306" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="617" y="72" width="274" height="306" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><text x="51" y="114" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035">A = diag(2,3)</text><text x="354" y="114" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035">B = diag(1,0)</text><text x="637" y="114" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035">齐次特征值 (α,β)</text><rect x="74" y="147" width="72" height="72" rx="12" fill="#e4f1ed" stroke="#d1e0d9" stroke-width="1.4"/><rect x="158" y="147" width="72" height="72" rx="12" fill="#f1f3f2" stroke="#d1e0d9" stroke-width="1.4"/><rect x="74" y="231" width="72" height="72" rx="12" fill="#f1f3f2" stroke="#d1e0d9" stroke-width="1.4"/><rect x="158" y="231" width="72" height="72" rx="12" fill="#e4f1ed" stroke="#d1e0d9" stroke-width="1.4"/><rect x="371" y="147" width="72" height="72" rx="12" fill="#f8e8dd" stroke="#d1e0d9" stroke-width="1.4"/><rect x="455" y="147" width="72" height="72" rx="12" fill="#f1f3f2" stroke="#d1e0d9" stroke-width="1.4"/><rect x="371" y="231" width="72" height="72" rx="12" fill="#f1f3f2" stroke="#d1e0d9" stroke-width="1.4"/><rect x="455" y="231" width="72" height="72" rx="12" fill="#f8e8dd" stroke="#d1e0d9" stroke-width="1.4"/><text x="103" y="193" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="500" fill="#147f80">2</text><text x="191" y="193" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="500" fill="#53676d">0</text><text x="103" y="280" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="500" fill="#53676d">0</text><text x="191" y="280" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="500" fill="#147f80">3</text><text x="400" y="193" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="500" fill="#c66345">1</text><text x="488" y="193" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="500" fill="#53676d">0</text><text x="400" y="280" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="500" fill="#53676d">0</text><text x="488" y="280" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="500" fill="#c66345">0</text><text x="643" y="174" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#147f80">(2,1) → λ=2</text><text x="643" y="232" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#c66345">(3,0) → λ=∞</text><text x="638" y="314" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">det(A−λB)=3(2−λ)</text><text x="32" y="407" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">当 det(A−λB) 不恒为 0，矩阵束称为 regular；此例的无穷远特征值是齐次特征值比值的极限。</text></svg>