<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" role="img" aria-labelledby="gap-title gap-desc"><title id="gap-title">扰动大小与特征间隙共同决定特征向量旋转</title><desc id="gap-desc">实对称矩阵 A=diag(2,1) 的主特征向量 e1，在 E=[[0,0.2],[0.2,0]] 扰动后偏转约 10.90 度；间隙越小，同等扰动下转角可变大。</desc><defs><marker id="gap-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="425" rx="18" fill="#f6faf8"/><text x="32" y="46" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035">A = diag(2,1)，E=[[0,0.2],[0.2,0]]；真实旋转角 ≈ 10.9°</text><rect x="27" y="72" width="412" height="309" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="483" y="72" width="410" height="309" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><text x="48" y="112" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#147f80">原主特征方向</text><text x="508" y="112" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#c66345">扰动后主方向</text><path d="M60 294L405 294" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M215 345L215 133" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M515 294L855 294" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M669 345L669 133" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M215 294L367 294" stroke="#147f80" stroke-width="5" stroke-linecap="round" fill="none" /><path d="M669 294L812 267" stroke="#c66345" stroke-width="5" stroke-linecap="round" fill="none" /><path d="M669 294L814 294" stroke="#147f80" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="6 6"/><path d="M710 294 A41 41 0 0 0 709.3 286.3" fill="none" stroke="#916c22" stroke-width="3"/><text x="57" y="346" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">λ₁=2，λ₂=1；间隙 1</text><text x="507" y="346" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">tan(2θ)=0.4；θ≈10.90°</text><text x="32" y="406" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">Davis–Kahan 对称/厄米谱子空间扰动需要谱隔离条件；仅有小 ‖E‖ 不能保证方向稳定。</text></svg>