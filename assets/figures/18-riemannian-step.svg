<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="riemstep-title riemstep-desc"><title id="riemstep-title">Riemannian 梯度下降的三步几何更新</title><desc id="riemstep-desc">环境梯度先投影到 Stiefel 切空间，再沿切向量迈步，最后用 QR 或极分解 retraction 回到满足正交约束的集合。</desc><defs><marker id="riemstep-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="18" fill="#f5f9f6"/><rect x="24" y="73" width="268" height="300" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="326" y="73" width="268" height="300" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="628" y="73" width="268" height="300" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><text x="45" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">① 投影到切空间</text><text x="347" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#c66345">② 沿切向量走一步</text><text x="649" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">③ Retraction 回流形</text><path d="M57 288 Q152 115 258 288" stroke="#9dbdb0" stroke-width="3" fill="none"/><circle cx="153" cy="194" r="7" fill="#147f80"/><path d="M153 194 L234 124" stroke="#c66345" stroke-width="4"/><path d="M153 194 L216 239" stroke="#147f80" stroke-width="4" stroke-dasharray="7 4"/><text x="170" y="118" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#c66345">G</text><text x="218" y="260" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#147f80">grad f</text><path d="M359 288 Q458 115 560 288" stroke="#9dbdb0" stroke-width="3" fill="none"/><circle cx="458" cy="194" r="7" fill="#147f80"/><path d="M458 194 L525 238" stroke="#147f80" stroke-width="4"/><path d="M458 194 L515 154" stroke="#c66345" stroke-width="3" stroke-dasharray="6 4"/><text x="518" y="256" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#147f80">X−ηξ</text><text x="511" y="137" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#c66345">环境方向</text><path d="M661 288 Q760 115 862 288" stroke="#9dbdb0" stroke-width="3" fill="none"/><circle cx="760" cy="194" r="7" fill="#147f80"/><path d="M760 194 L817 232" stroke="#147f80" stroke-width="4"/><circle cx="817" cy="232" r="7" fill="#c66345"/><text x="818" y="260" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#c66345">QR(X−ηξ)</text><text x="43" y="334" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">ξ=G−X sym(XᵀG)</text><text x="346" y="334" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">试探点通常不再正交</text><text x="648" y="334" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">R_X(ξ) 满足 XᵀX=I</text><text x="31" y="414" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">图示是几何流程示意；具体曲线、度量与 retraction 必须与所选流形及度量定义一致。</text></svg>