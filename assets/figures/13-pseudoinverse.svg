<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" role="img" aria-labelledby="pinv-title pinv-desc"><title id="pinv-title">伪逆把残差投影和最小范数选择联系起来</title><desc id="pinv-desc">A=diag(2,0), b=(2,3)，最小二乘输出 Ax=(2,0) 是 b 在列空间的正交投影；所有 x=(1,t) 同样拟合，伪逆选最小长度的 x=(1,0)。</desc><defs><marker id="pinv-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="425" rx="18" fill="#f6faf8"/><rect x="26" y="72" width="417" height="300" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="476" y="72" width="416" height="300" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><text x="50" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#147f80">输出空间：投影 b 到 im(A)</text><text x="493" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#c66345">输入空间：在解集中选最短 x</text><path d="M60 289L409 289" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M157 350L157 109" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M510 289L865 289" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M610 350L610 110" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><circle cx="325" cy="159" r="7" fill="#c66345" stroke="#c66345" stroke-width="2"/><circle cx="325" cy="289" r="7" fill="#147f80" stroke="#147f80" stroke-width="2"/><path d="M325 159L325 289" stroke="#c66345" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="7 5"/><path d="M157 289L325 289" stroke="#147f80" stroke-width="3" stroke-linecap="round" fill="none" /><text x="331" y="154" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="500" fill="#c66345">b=(2,3)</text><text x="331" y="317" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="500" fill="#147f80">Ax=(2,0)</text><text x="66" y="352" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">残差 r=(0,3) 与列空间正交</text><path d="M759 126L759 337" stroke="#7461ba" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="7 5"/><circle cx="759" cy="289" r="7" fill="#147f80" stroke="#147f80" stroke-width="2"/><circle cx="759" cy="183" r="6" fill="#c66345" stroke="#c66345" stroke-width="2"/><path d="M610 289L759 289" stroke="#147f80" stroke-width="3" stroke-linecap="round" fill="none" /><text x="767" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#c66345">(1,t)</text><text x="767" y="315" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="500" fill="#147f80">(1,0)</text><text x="500" y="352" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">竖直解集 x₁=1；最小范数点在 x₂=0</text><text x="31" y="405" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">输出投影与输入最小范数是两个不同的最优性条件；Moore–Penrose 伪逆同时满足它们。</text></svg>