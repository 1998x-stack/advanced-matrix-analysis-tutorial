<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="fm-title fm-desc"><title id="fm-title">矩阵分析前沿方向的成熟度地图</title><desc id="fm-desc">五个方向按所处阶段排列：深度矩阵分解与矩阵函数的 Krylov 近似已有成熟实现（工程可用）；可微矩阵分解与四元数矩阵方法有实现但各有适用边界；量子线性代数（HHL 等）主要是理论，受稀疏性、条件数、QRAM 与读出限制。颜色区分阶段：青=工程可用，紫=有实现，珊瑚=理论。</desc><rect width="900" height="270" rx="14" fill="#fffdf9" stroke="#dce3df"/>
<text x="30" y="40" font-size="15" fill="#203035" font-family="sans-serif">方向与成熟度（颜色 = 阶段）</text>
<rect x="30" y="80" width="160" height="110" rx="8" fill="#e8f4f2" stroke="#147f80" stroke-width="1.8"/><text x="46" y="116" font-size="14" fill="#203035" font-family="sans-serif">深度矩阵分解</text><text x="46" y="140" font-size="13" fill="#53676d" font-family="sans-serif">多层 NMF / Semi-NMF</text><text x="46" y="170" font-size="13" fill="#147f80" font-family="sans-serif">工程可用</text>
<rect x="205" y="80" width="160" height="110" rx="8" fill="#e8f4f2" stroke="#147f80" stroke-width="1.8"/><text x="221" y="116" font-size="14" fill="#203035" font-family="sans-serif">矩阵函数近似</text><text x="221" y="140" font-size="13" fill="#53676d" font-family="sans-serif">Krylov 求 f(A)b</text><text x="221" y="170" font-size="13" fill="#147f80" font-family="sans-serif">工程可用</text>
<rect x="380" y="80" width="160" height="110" rx="8" fill="#efeaf8" stroke="#7461ba" stroke-width="1.8"/><text x="396" y="116" font-size="14" fill="#203035" font-family="sans-serif">可微矩阵分解</text><text x="396" y="140" font-size="13" fill="#53676d" font-family="sans-serif">SVD/特征分解反传</text><text x="396" y="170" font-size="13" fill="#7461ba" font-family="sans-serif">有实现</text>
<rect x="555" y="80" width="160" height="110" rx="8" fill="#efeaf8" stroke="#7461ba" stroke-width="1.8"/><text x="571" y="116" font-size="14" fill="#203035" font-family="sans-serif">四元数矩阵</text><text x="571" y="140" font-size="13" fill="#53676d" font-family="sans-serif">彩色/偏振 QSVD</text><text x="571" y="170" font-size="13" fill="#7461ba" font-family="sans-serif">有实现 · 小众</text>
<rect x="730" y="80" width="140" height="110" rx="8" fill="#fbf2ed" stroke="#c66345" stroke-width="1.8"/><text x="746" y="116" font-size="14" fill="#203035" font-family="sans-serif">量子线性代数</text><text x="746" y="140" font-size="13" fill="#53676d" font-family="sans-serif">HHL / 量子 SVD</text><text x="746" y="170" font-size="13" fill="#c66345" font-family="sans-serif">理论为主</text>
<text x="30" y="224" font-size="13" fill="#53676d" font-family="sans-serif">可验证观察：唯一带几何级加速声明的方向（量子）也是前提最多、硬件最不成熟的一个。</text>
<text x="30" y="248" font-size="13" fill="#c66345" font-family="sans-serif">注意：本图为方向分类示意，不代表各方向的具体性能或收益。</text></svg>
