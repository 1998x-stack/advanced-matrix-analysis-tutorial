<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="jordan-title jordan-desc"><title id="jordan-title">Jordan 链中的广义特征向量</title><desc id="jordan-desc">J=[[2,1],[0,2]] 只有一个独立特征向量 v=e1，广义特征向量 w=e2 形成 (J−2I)w=v 的链。</desc><rect width="920" height="420" rx="18" fill="#f6faf8"/><text x="35" y="46" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#203035">不可对角化不是“没有特征值”，而是特征向量不足。</text><rect x="30" y="75" width="388" height="290" rx="12" fill="#fff" stroke="#d6e1dc"/><rect x="475" y="75" width="414" height="290" rx="12" fill="#fff" stroke="#d6e1dc"/><text x="54" y="109" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#147f80">代数链：N = J−2I</text><rect x="62" y="132" width="320" height="68" rx="12" fill="#e7f2ee" stroke="#d6e1dc"/><text x="90" y="175" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#147f80">w = e₂，Nw = v</text><path d="M221,202L221,251" fill="none" stroke="#147f80" stroke-width="3"/><rect x="62" y="252" width="320" height="68" rx="12" fill="#fbe9e1" stroke="#d6e1dc"/><text x="90" y="295" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#c66345">v = e₁，Nv = 0</text><text x="506" y="109" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#147f80">几何：缩放 + 剪切</text><path d="M528,295L849,295" fill="none" stroke="#b5ccc2" stroke-width="2"/><path d="M583,341L583,137" fill="none" stroke="#b5ccc2" stroke-width="2"/><path d="M583,295L774,295" fill="none" stroke="#c66345" stroke-width="5"/><path d="M583,295L690,164" fill="none" stroke="#7461ba" stroke-width="5"/><text x="755" y="321" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#c66345">Jv=2v</text><text x="675" y="148" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#7461ba">Jw=v+2w</text><text x="35" y="398" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53676d">只有 v 的方向保持；w 被加上 v 分量，这是 Jordan 块的剪切。</text></svg>