<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" role="img" aria-labelledby="schur-title schur-desc"><title id="schur-title">复 Schur 上三角形与实 Schur 二阶实块</title><desc id="schur-desc">左侧非正规 Jordan 方阵在复数域下仍可处于上三角 Schur 形式；右侧实旋转矩阵对应非实共轭特征值，在实 Schur 形式使用2×2块。</desc><defs><marker id="schur-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="425" rx="18" fill="#f6faf8"/><rect x="29" y="73" width="418" height="304" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="474" y="73" width="416" height="304" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><text x="50" y="50" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#147f80">复 Schur：A = Q T Q*</text><text x="496" y="50" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#c66345">实 Schur：A = Q T Qᵀ</text><text x="53" y="115" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035">T = [[2, 1], [0, 2]]</text><rect x="95" y="146" width="95" height="80" rx="12" fill="#e4f3ef" stroke="#d1e0d9" stroke-width="1.4"/><rect x="202" y="146" width="95" height="80" rx="12" fill="#fce8dd" stroke="#d1e0d9" stroke-width="1.4"/><rect x="95" y="237" width="95" height="80" rx="12" fill="#f2f5f3" stroke="#d1e0d9" stroke-width="1.4"/><rect x="202" y="237" width="95" height="80" rx="12" fill="#e4f3ef" stroke="#d1e0d9" stroke-width="1.4"/><text x="128" y="195" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#147f80">2</text><text x="234" y="195" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#c66345">1</text><text x="128" y="284" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#53676d">0</text><text x="234" y="284" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#147f80">2</text><text x="50" y="351" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">Jordan 形本身已是上三角</text><text x="496" y="115" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035">T = [[0, −1], [1, 0]]</text><rect x="548" y="146" width="95" height="80" rx="12" fill="#eae6f5" stroke="#d1e0d9" stroke-width="1.4"/><rect x="655" y="146" width="95" height="80" rx="12" fill="#eae6f5" stroke="#d1e0d9" stroke-width="1.4"/><rect x="548" y="237" width="95" height="80" rx="12" fill="#eae6f5" stroke="#d1e0d9" stroke-width="1.4"/><rect x="655" y="237" width="95" height="80" rx="12" fill="#eae6f5" stroke="#d1e0d9" stroke-width="1.4"/><text x="580" y="195" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#7461ba">0</text><text x="682" y="195" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#7461ba">−1</text><text x="580" y="284" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#7461ba">1</text><text x="685" y="284" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#7461ba">0</text><text x="496" y="351" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">2×2 实块对应复共轭对 ±i</text><text x="31" y="406" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">实 Schur 形式可有 1×1、2×2 的对角块；复 Schur 形式为真正上三角；两者都比 Jordan 数值上稳健。</text></svg>