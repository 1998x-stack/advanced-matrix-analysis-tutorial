<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="nmffactor-title nmffactor-desc"><title id="nmffactor-title">非负矩阵分解把数据写成非负基与非负系数的加性组合</title><desc id="nmffactor-desc">V 的每一列是一个样本；W 的列是非负基向量，H 的列是对应样本的非负激活系数，V≈WH。</desc><defs><marker id="nmffactor-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="18" fill="#f5f9f6"/><rect x="25" y="75" width="210" height="293" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="272" y="75" width="270" height="293" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="580" y="75" width="315" height="293" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><text x="45" y="50" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">数据 V</text><text x="292" y="50" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">基 W × 系数 H</text><text x="600" y="50" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#c66345">重建 V̂=WH</text><rect x="59" y="117" width="54" height="54" rx="13" fill="#d9eee7" stroke="#d5e2dc" stroke-width="1.5"/><rect x="126" y="117" width="54" height="54" rx="13" fill="#f4e6d6" stroke="#d5e2dc" stroke-width="1.5"/><rect x="59" y="185" width="54" height="54" rx="13" fill="#eeeafb" stroke="#d5e2dc" stroke-width="1.5"/><rect x="126" y="185" width="54" height="54" rx="13" fill="#d9eee7" stroke="#d5e2dc" stroke-width="1.5"/><rect x="59" y="253" width="54" height="54" rx="13" fill="#f4e6d6" stroke="#d5e2dc" stroke-width="1.5"/><rect x="126" y="253" width="54" height="54" rx="13" fill="#eeeafb" stroke="#d5e2dc" stroke-width="1.5"/><text x="122" y="353" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#53676d">features × samples</text><rect x="304" y="117" width="83" height="175" rx="13" fill="#e2f1eb" stroke="#d5e2dc" stroke-width="1.5"/><rect x="409" y="117" width="83" height="175" rx="13" fill="#f7e8df" stroke="#d5e2dc" stroke-width="1.5"/><text x="345" y="148" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#147f80">W</text><text x="450" y="148" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#c66345">H</text><text x="345" y="181" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#53676d">m×r</text><text x="450" y="181" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#53676d">r×n</text><text x="345" y="228" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#53676d">非负基</text><text x="450" y="228" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#53676d">非负权重</text><path d="M388 203L406 203" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" marker-end="url(#nmff-arrow)"/><rect x="626" y="117" width="224" height="175" rx="13" fill="#e8f2ed" stroke="#d5e2dc" stroke-width="1.5"/><text x="738" y="151" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#147f80">每列样本</text><text x="738" y="196" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203035">≈ Σₖ Hₖⱼ Wₖ</text><text x="738" y="240" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#53676d">只做非负加法</text><text x="43" y="330" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">Vᵢⱼ ≥ 0</text><text x="299" y="330" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">Wᵢₖ ≥ 0，Hₖⱼ ≥ 0</text><text x="626" y="330" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">每个系数描述基的激活强度</text><text x="30" y="414" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">非负性允许加性解释，但不自动保证学到的基就是人类可读的“部件”或唯一真实因子。</text></svg>