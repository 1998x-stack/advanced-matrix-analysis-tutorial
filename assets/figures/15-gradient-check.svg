<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" role="img" aria-labelledby="gradcheck-title gradcheck-desc"><title id="gradcheck-title">中心差分与解析方向导数对照</title><desc id="gradcheck-desc">检查 L(X)=1/2||AX−B||² 时，沿方向 H 的真实方向导数是 &lt;∇L,H&gt;；中心差分在合理步长时接近它，但步长过小会受舍入误差影响。</desc><defs><marker id="gradcheck-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="425" rx="18" fill="#f6faf8"/><text x="30" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#203035">沿方向 H 检查：D_H L(X) = ⟨∇L(X), H⟩</text><rect x="29" y="79" width="862" height="295" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><path d="M93 319L845 319" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M93 319L93 111" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><text x="105" y="110" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">对数误差（示意）</text><text x="694" y="350" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">log₁₀(h)</text><path d="M122 132 C260 178 364 279 470 295 C585 315 692 256 816 123" stroke="#147f80" stroke-width="4" fill="none"/><text x="117" y="156" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#c66345">截断误差占优</text><text x="554" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#c66345">舍入误差占优</text><text x="345" y="284" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#147f80">可用步长区域</text><text x="32" y="404" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">曲线只表示误差竞争的典型形状，不代表任何指定机器、函数或 h 的测量数据。</text></svg>