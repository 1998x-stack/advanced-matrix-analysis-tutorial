<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" role="img" aria-labelledby="diff-title diff-desc"><title id="diff-title">从矩阵前向计算到伴随梯度传播的形状跟踪</title><desc id="diff-desc">对 L(X)=1/2 ||AX−B||_F²，输入 A 为 m×n、X 为 n×p，残差 R 为 m×p，输出 L 为标量；反向传播梯度 ∇_X L=AᵀR 为 n×p。</desc><defs><marker id="diff-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="425" rx="18" fill="#f6faf8"/><text x="30" y="46" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#147f80">正向：X → AX → R=AX−B → L=½‖R‖F²</text><rect x="26" y="83" width="187" height="201" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="252" y="83" width="187" height="201" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="479" y="83" width="187" height="201" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="704" y="83" width="187" height="201" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><text x="45" y="137" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035">X</text><text x="271" y="137" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035">A X</text><text x="497" y="137" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035">R=AX−B</text><text x="723" y="137" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035">L</text><text x="44" y="175" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#53676d">n×p</text><text x="270" y="175" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#53676d">m×p</text><text x="496" y="175" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#53676d">m×p</text><text x="722" y="175" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#53676d">scalar</text><text x="44" y="236" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">变量</text><text x="270" y="236" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">线性映射</text><text x="496" y="236" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">预测误差</text><text x="722" y="236" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">标量损失</text><path d="M211 178L246 178" stroke="#147f80" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#diff-arrow)"/><path d="M437 178L472 178" stroke="#147f80" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#diff-arrow)"/><path d="M663 178L698 178" stroke="#147f80" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#diff-arrow)"/><path d="M782 293L782 334" stroke="#c66345" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M776 336L138 336" stroke="#c66345" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M138 336L138 296" stroke="#c66345" stroke-width="3" stroke-linecap="round" fill="none" /><text x="303" y="326" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#c66345">反向：∇X L = AᵀR，维度 n×p</text><text x="30" y="399" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">矩阵乘法次序不可随意交换：链式法则的转置来自 Frobenius 内积与微分配对。</text></svg>