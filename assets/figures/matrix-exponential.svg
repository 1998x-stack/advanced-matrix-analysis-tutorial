<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="expm-title expm-desc"><title id="expm-title">Jordan 块矩阵指数的几何时间流</title><desc id="expm-desc">对 J=2I+N 且 N²=0，e^{tJ}=e^{2t}(I+tN)，图中去除共同的指数缩放，仅展示剪切变化。</desc><rect width="920" height="420" rx="18" fill="#f6faf8"/><text x="34" y="45" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#203035">x′=Jx，J=2I+N，N²=0；图中只展示 I+tN 的形状。</text><rect x="42" y="77" width="280" height="280" rx="12" fill="#fff" stroke="#d6e1dc"/><text x="61" y="114" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#147f80">t = 0</text><polygon points="77,251 170,251 170,147 77,147" fill="#e6f3ef" stroke="#147f80" stroke-width="3"/><path d="M77,251L170,251" fill="none" stroke="#c66345" stroke-width="4"/><path d="M77,251L77,147" fill="none" stroke="#7461ba" stroke-width="4"/><text x="61" y="328" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53676d">I：无剪切</text><rect x="349" y="77" width="280" height="280" rx="12" fill="#fff" stroke="#d6e1dc"/><text x="368" y="114" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#147f80">t = 0.5</text><polygon points="384,251 477,251 510.5,147 417.5,147" fill="#e6f3ef" stroke="#147f80" stroke-width="3"/><path d="M384,251L477,251" fill="none" stroke="#c66345" stroke-width="4"/><path d="M384,251L417.5,147" fill="none" stroke="#7461ba" stroke-width="4"/><text x="368" y="328" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53676d">剪切系数 t=0.5</text><rect x="656" y="77" width="280" height="280" rx="12" fill="#fff" stroke="#d6e1dc"/><text x="675" y="114" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#147f80">t = 1</text><polygon points="691,251 784,251 851,147 758,147" fill="#e6f3ef" stroke="#147f80" stroke-width="3"/><path d="M691,251L784,251" fill="none" stroke="#c66345" stroke-width="4"/><path d="M691,251L758,147" fill="none" stroke="#7461ba" stroke-width="4"/><text x="675" y="328" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53676d">剪切系数 t=1</text><text x="33" y="397" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53676d">完整解还包含 e^{2t} 的各向同性缩放；矩阵指数同时描述增长与剪切。</text></svg>