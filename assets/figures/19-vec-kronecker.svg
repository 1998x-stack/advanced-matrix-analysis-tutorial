<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="veckronecker-title veckronecker-desc"><title id="veckronecker-title">vec 按列堆叠，Kronecker 积把矩阵乘法变成线性系统</title><desc id="veckronecker-desc">2×2 矩阵 X 的列向量化顺序是 x11,x21,x12,x22；AX+XB=C 因而对应 Kronecker 和线性系统。</desc><defs><marker id="veckronecker-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="18" fill="#f5f9f6"/><rect x="25" y="73" width="255" height="302" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="303" y="73" width="288" height="302" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="615" y="73" width="280" height="302" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><text x="44" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">矩阵 X</text><text x="324" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">列优先 vec(X)</text><text x="635" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#c66345">Kronecker 线性系统</text><rect x="65" y="120" width="78" height="76" rx="13" fill="#d9eee7" stroke="#d5e2dc" stroke-width="1.5"/><rect x="153" y="120" width="78" height="76" rx="13" fill="#f2f6f3" stroke="#d5e2dc" stroke-width="1.5"/><rect x="65" y="208" width="78" height="76" rx="13" fill="#f2f6f3" stroke="#d5e2dc" stroke-width="1.5"/><rect x="153" y="208" width="78" height="76" rx="13" fill="#f2f6f3" stroke="#d5e2dc" stroke-width="1.5"/><text x="104" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#147f80">x₁₁</text><text x="192" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#53676d">x₁₂</text><text x="104" y="254" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#c66345">x₂₁</text><text x="192" y="254" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#53676d">x₂₂</text><rect x="394" y="104" width="96" height="50" rx="13" fill="#d9eee7" stroke="#d5e2dc" stroke-width="1.5"/><rect x="394" y="165" width="96" height="50" rx="13" fill="#fbe8df" stroke="#d5e2dc" stroke-width="1.5"/><rect x="394" y="226" width="96" height="50" rx="13" fill="#f2f6f3" stroke="#d5e2dc" stroke-width="1.5"/><rect x="394" y="287" width="96" height="50" rx="13" fill="#f2f6f3" stroke="#d5e2dc" stroke-width="1.5"/><text x="442" y="136" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#203035">x₁₁</text><text x="442" y="197" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#203035">x₂₁</text><text x="442" y="258" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#203035">x₁₂</text><text x="442" y="319" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#203035">x₂₂</text><text x="625" y="112" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#203035">(I⊗A + Bᵀ⊗I) vec(X)</text><text x="625" y="145" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#203035">= vec(C)</text><rect x="640" y="190" width="91" height="55" rx="13" fill="#e6f1ed" stroke="#d5e2dc" stroke-width="1.5"/><rect x="743" y="190" width="91" height="55" rx="13" fill="#e6f1ed" stroke="#d5e2dc" stroke-width="1.5"/><rect x="640" y="255" width="91" height="55" rx="13" fill="#e6f1ed" stroke="#d5e2dc" stroke-width="1.5"/><rect x="743" y="255" width="91" height="55" rx="13" fill="#e6f1ed" stroke="#d5e2dc" stroke-width="1.5"/><text x="685" y="223" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#147f80">K₁₁</text><text x="788" y="223" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#147f80">K₁₂</text><text x="685" y="288" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#147f80">K₂₁</text><text x="788" y="288" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#147f80">K₂₂</text><text x="43" y="337" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">按列读：先第一列，再第二列</text><text x="321" y="337" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">vec(X)∈R⁴</text><text x="630" y="337" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">大系统尺寸 mn × mn</text><text x="30" y="414" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">vec(AXB)=(Bᵀ⊗A)vec(X)；若采用按行堆叠，转置位置会改变。</text></svg>