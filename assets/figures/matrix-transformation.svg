<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="transform-title transform-desc"><title id="transform-title">行列式、长度变化与秩的区别</title><desc id="transform-desc">对同一单位正方形分别施加恒等、面积保持的各向异性缩放和秩亏压缩。</desc><defs><marker id="transform-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="410" rx="18" fill="#f7faf8"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#203035">
<rect x="22" y="75" width="260" height="260" rx="10" fill="#fff" stroke="#dce5df"/><rect x="328" y="75" width="260" height="260" rx="10" fill="#fff" stroke="#dce5df"/><rect x="634" y="75" width="260" height="260" rx="10" fill="#fff" stroke="#dce5df"/>
<text x="50" y="49" fill="#203035" font-size="18" font-weight="700">I：所有方向都不变</text><text x="350" y="49" fill="#203035" font-size="18" font-weight="700">A = diag(2, 1/2)</text><text x="658" y="49" fill="#203035" font-size="18" font-weight="700">B = diag(2, 0)</text>
<line x1="60" y1="224" x2="246" y2="224" stroke="#bdd0c8" stroke-width="1.5" /><line x1="152" y1="311" x2="152" y2="139" stroke="#bdd0c8" stroke-width="1.5" /><line x1="366" y1="224" x2="552" y2="224" stroke="#bdd0c8" stroke-width="1.5" /><line x1="458" y1="311" x2="458" y2="139" stroke="#bdd0c8" stroke-width="1.5" /><line x1="672" y1="224" x2="858" y2="224" stroke="#bdd0c8" stroke-width="1.5" /><line x1="764" y1="311" x2="764" y2="139" stroke="#bdd0c8" stroke-width="1.5" />
<rect x="104" y="177" width="96" height="96" fill="#d7eee8" stroke="#147f80" stroke-width="3"/>
<rect x="362" y="201" width="192" height="48" fill="#fce7dd" stroke="#c66345" stroke-width="3"/>
<path d="M668 225 H860" stroke="#7461ba" stroke-width="6"/>
<text x="51" y="358" fill="#147f80" font-size="17" font-weight="700">det(I) = 1</text><text x="357" y="358" fill="#c66345" font-size="16" font-weight="700">det(A) = 1；长宽互换倍率</text><text x="657" y="358" fill="#7461ba" font-size="16" font-weight="700">det(B) = 0；丢失一个维度</text>
<text x="38" y="391" fill="#53676d" font-size="14" font-weight="400">单位正方形面积为 1</text><text x="351" y="391" fill="#53676d" font-size="14" font-weight="400">面积不变 ≠ 长度不变</text><text x="658" y="391" fill="#53676d" font-size="14" font-weight="400">二维区域塌缩成线段</text>
</g></svg>