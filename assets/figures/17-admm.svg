mm-arrow)"/><rect x="333" y="285" width="214" height="55" rx="13" fill="#eeeafb" stroke="#7461ba" stroke-width="1.5"/><text x="440" y="319" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#203035">U 更新：对偶累积</text><rect x="637" y="110" width="224" height="72" rx="13" fill="#e5f2ee" stroke="#d5e2dc" stroke-width="1.5"/><text x="656" y="139" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#147f80">原始残差</text><text x="656" y="165" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#203035">rᵏ = Xᵏ − Zᵏ</text><rect x="637" y="198" width="224" height="72" rx="13" fill="#eeeafb" stroke="#d5e2dc" stroke-width="1.5"/><text x="656" y="227" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#7461ba">对偶残差</text><text x="656" y="253" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203035">sᵏ = ρ(Zᵏ−Zᵏ⁻¹)</text><text x="637" y="320" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">两种残差都足够小再停止</text><text x="30" y="412" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">此图对应 min ½‖PΩ(X−M)‖²+λ‖Z‖*，约束 X=Z 的标准两块凸 ADMM 分裂。</text></svg>