<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" role="img" aria-labelledby="trunc-title trunc-desc"><title id="trunc-title">截断 SVD 的最优低秩误差由丢弃奇异值控制</title><desc id="trunc-desc">A=diag(5,2,0)，保留前1个奇异值时 Frobenius 误差是2；保留前2个时误差是0。</desc><defs><marker id="trunc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="425" rx="18" fill="#f6faf8"/><text x="32" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#203035">A = diag(5,2,0)：保留前 k 个最大奇异值</text><rect x="30" y="80" width="254" height="295" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="334" y="80" width="254" height="295" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="640" y="80" width="254" height="295" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><text x="50" y="117" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035">原矩阵 A</text><text x="355" y="117" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035">k=1：A₁</text><text x="660" y="117" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035">k=2：A₂=A</text><rect x="66" y="153" width="53" height="53" rx="12" fill="#b7dcd3" stroke="#d1e0d9" stroke-width="1.4"/><rect x="128" y="153" width="53" height="53" rx="12" fill="#f7d5c5" stroke="#d1e0d9" stroke-width="1.4"/><rect x="190" y="153" width="53" height="53" rx="12" fill="#f0f3f2" stroke="#d1e0d9" stroke-width="1.4"/><rect x="371" y="153" width="53" height="53" rx="12" fill="#b7dcd3" stroke="#d1e0d9" stroke-width="1.4"/><rect x="433" y="153" width="53" height="53" rx="12" fill="#f0f3f2" stroke="#d1e0d9" stroke-width="1.4"/><rect x="495" y="153" width="53" height="53" rx="12" fill="#f0f3f2" stro