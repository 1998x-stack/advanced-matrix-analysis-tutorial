nt-size="16" font-weight="500" fill="#53676d">σ=(5,2,0)</text><text x="51" y="322" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="500" fill="#147f80">‖A‖F=√29</text><text x="356" y="322" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="500" fill="#c66345">‖A−A₁‖F=2</text><text x="660" y="322" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="500" fill="#147f80">‖A−A₂‖F=0</text><text x="34" y="405" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">Eckart–Young–Mirsky：任意秩≤k 的近似都不能比截断 SVD 在 2-范数/Frobenius 范数下更优。</text></svg>