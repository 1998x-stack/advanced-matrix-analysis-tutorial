<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="svdgap-title svdgap-desc"><title id="svdgap-title">截断 SVD 的谱间隙决定最佳子空间是否唯一</title><desc id="svdgap-desc">左图 sigma2 大于 sigma3，rank-2 最佳近似唯一；右图在截断位置出现相等奇异值，保留哪个方向不唯一。</desc><defs><marker id="svdgap-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="18" fill="#f5f9f6"/><rect x="27" y="73" width="416" height="304" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="477" y="73" width="415" height="304" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><text x="51" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#147f80">有间隙：σ₂ &gt; σ₃</text><text x="500" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#c66345">截断处并列：σ₂ = σ₃</text><rect x="75" y="140" width="48" height="130" rx="5" fill="#b9ddd4" stroke="#147f80" stroke-width="1.5"/><rect x="150" y="140" width="48" height="78" rx="5" fill="#b9ddd4" stroke="#147f80" stroke-width="1.5"/><rect x="225" y="140" width="48" height="39" rx="5" fill="#b9ddd4" stroke="#147f80" stroke-width="1.5"/><rect x="300" y="140" width="48" height="20.8" rx="5" fill="#b9ddd4" stroke="#147f80" stroke-width="1.5"/><path d="M61 295L413 295" fill="none" stroke="#879a93" stroke-width="2" stroke-linecap="round"/><path d="M61 218L413 218" fill="none" stroke="#c66345" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="67" y="321" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">σ₁=5</text><text x="142" y="321" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">σ₂=3</text><text x="217" y="321" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">σ₃=1.5</text><text x="292" y="321" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">σ₄=.8</text><text x="63" y="204" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#c66345">rank-2 截断线</text><rect x="525" y="140" width="48" height="104" rx="5" fill="#f1d3c6" stroke="#c66345" stroke-width="1.5"/><rect x="600" y="140" width="48" height="52" rx="5" fill="#f1d3c6" stroke="#c66345" stroke-width="1.5"/><rect x="675" y="140" width="48" height="52" rx="5" fill="#f1d3c6" stroke="#c66345" stroke-width="1.5"/><rect x="750" y="140" width="48" height="26" rx="5" fill="#f1d3c6" stroke="#c66345" stroke-width="1.5"/><path d="M511 295L863 295" fill="none" stroke="#879a93" stroke-width="2" stroke-linecap="round"/><path d="M511 218L863 218" fill="none" stroke="#c66345" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="518" y="321" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">σ₁=4</text><text x="593" y="321" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">σ₂=2</text><text x="668" y="321" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">σ₃=2</text><text x="743" y="321" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">σ₄=.7</text><text x="512" y="204" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#c66345">截断处相等</text><text x="50" y="356" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#147f80">前 2 维主子空间唯一；投影/低秩近似局部稳定</text><text x="500" y="356" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#c66345">可在相等方向间旋转；最佳 rank-2 近似不唯一</text><text x="31" y="412" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">σ₂&gt;σ₃ 是唯一性/局部光滑性的关键间隙；即使子空间光滑，U、V 因子仍有符号与基变换自由度。</text></svg>