<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="norms-title norms-desc"><title id="norms-title">不同向量范数的单位球</title><desc id="norms-desc">二维空间中的 l1 单位球为菱形，l2 单位球为圆，l∞ 单位球为正方形；均以原点为中心。</desc><defs><marker id="norms-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="410" rx="18" fill="#f7faf8"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#203035">
<line x1="41" y1="214" x2="273" y2="214" stroke="#b8cac2" stroke-width="1.6" /><line x1="157" y1="328" x2="157" y2="103" stroke="#b8cac2" stroke-width="1.6" /><line x1="351" y1="214" x2="583" y2="214" stroke="#b8cac2" stroke-width="1.6" /><line x1="467" y1="328" x2="467" y2="103" stroke="#b8cac2" stroke-width="1.6" /><line x1="661" y1="214" x2="893" y2="214" stroke="#b8cac2" stroke-width="1.6" /><line x1="777" y1="328" x2="777" y2="103" stroke="#b8cac2" stroke-width="1.6" />
<path d="M157 117 L253 214 L157 311 L61 214 Z" fill="#e7f3ef" stroke="#147f80" stroke-width="3"/>
<circle cx="467" cy="214" r="96" fill="#fbe9df" stroke="#c66345" stroke-width="3"/>
<rect x="681" y="118" width="192" height="192" fill="#eeeafa" stroke="#7461ba" stroke-width="3"/>
<text x="71" y="68" fill="#147f80" font-size="21" font-weight="700">‖x‖₁ ≤ 1</text><text x="380" y="68" fill="#c66345" font-size="21" font-weight="700">‖x‖₂ ≤ 1</text><text x="684" y="68" fill="#7461ba" font-size="21" font-weight="700">‖x‖∞ ≤ 1</text>
<text x="102" y="367" fill="#53676d" font-size="16" font-weight="400">|x₁| + |x₂|</text><text x="408" y="367" fill="#53676d" font-size="16" font-weight="400">√(x₁² + x₂²)</text><text x="711" y="367" fill="#53676d" font-size="16" font-weight="400">max(|x₁|,|x₂|)</text>
<text x="32" y="393" fill="#53676d" font-size="14" font-weight="400">图形展示单位球边界，而非同一点在三种范数下长度相同。</text>
</g></svg>