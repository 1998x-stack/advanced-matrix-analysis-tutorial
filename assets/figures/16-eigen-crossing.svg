<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="eigencross-title eigencross-desc"><title id="eigencross-title">简单特征值与重根交叉的导数</title><desc id="eigencross-desc">对角矩阵 A(t)=diag(2+t,2−t) 的两条有标签特征值分支光滑相交；按大小排序的最大特征值 2+|t| 在交点有折角。</desc><defs><marker id="eigencross-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="18" fill="#f5f9f6"/><rect x="28" y="75" width="416" height="304" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="476" y="75" width="416" height="304" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><text x="52" y="51" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#147f80">保留分支标签：两条线都可微</text><text x="500" y="51" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#c66345">按大小排序：最大特征值有折角</text><path d="M82 320L402 320" fill="none" stroke="#6c7d79" stroke-width="2" stroke-linecap="round"/><path d="M242 342L242 112" fill="none" stroke="#6c7d79" stroke-width="2" stroke-linecap="round"/><path d="M530 320L850 320" fill="none" stroke="#6c7d79" stroke-width="2" stroke-linecap="round"/><path d="M690 342L690 112" fill="none" stroke="#6c7d79" stroke-width="2" stroke-linecap="round"/><path d="M105 295 L380 160" stroke="#147f80" stroke-width="4" fill="none"/><path d="M105 160 L380 295" stroke="#c66345" stroke-width="4" fill="none"/><path d="M555 295 L690 228 L825 160" stroke="#c66345" stroke-width="4" fill="none"/><path d="M555 160 L690 228 L825 295" stroke="#c7d4ce" stroke-width="2" fill="none" stroke-dasharray="5 5"/><circle cx="242" cy="228" r="6" fill="#203035" stroke="#203035" stroke-width="2"/><circle cx="690" cy="228" r="6" fill="#203035" stroke="#203035" stroke-width="2"/><text x="104" y="145" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#147f80">λ₁(t)=2+t</text><text x="284" y="310" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#c66345">λ₂(t)=2−t</text><text x="690" y="207" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#c66345">λmax(t)=2+|t|</text><text x="55" y="357" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">t=0：有标签的两个分支斜率分别 +1、−1</text><text x="503" y="357" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">t=0：左右导数 −1 与 +1，不可微</text><text x="31" y="412" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">重特征值不意味着所有谱函数都不连续；排序后的单个特征值可能仅方向可微，矩阵谱函数另有可微条件。</text></svg>