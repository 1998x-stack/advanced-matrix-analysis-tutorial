<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="house-title house-desc"><title id="house-title">Householder 反射把向量对齐坐标轴</title><desc id="house-desc">x=(3,4) 长度为 5；Householder 反射 H 保持长度，变为 Hx=(5,0)，从而消去下方分量。</desc><rect width="920" height="420" rx="18" fill="#f6faf8"/><text x="30" y="45" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#203035">x=(3,4)，‖x‖₂=5 → Hx=(5,0)；HᵀH=I</text><rect x="30" y="75" width="403" height="301" rx="12" fill="#fff" stroke="#d6e1dc"/><rect x="483" y="75" width="405" height="301" rx="12" fill="#fff" stroke="#d6e1dc"/><text x="51" y="112" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#203035">反射前：斜向量</text><text x="500" y="112" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#203035">反射后：水平向量</text><path d="M63,302L397,302" fill="none" stroke="#b5ccc2" stroke-width="2"/><path d="M121,349L121,130" fill="none" stroke="#b5ccc2" stroke-width="2"/><path d="M511,302L862,302" fill="none" stroke="#b5ccc2" stroke-width="2"/><path d="M572,349L572,130" fill="none" stroke="#b5ccc2" stroke-width="2"/><path d="M121,302L258,119" fill="none" stroke="#c66345" stroke-width="5"/><path d="M572,302L839,302" fill="none" stroke="#147f80" stroke-width="5"/><text x="264" y="120" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#c66345">x</text><text x="735" y="287" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#147f80">Hx</text><path d="M437,212L475,212" fill="none" stroke="#147f80" stroke-width="3"/><text x="30" y="401" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53676d">H = I − 2vvᵀ/(vᵀv)，v = x−5e₁。逐列反射可构造 A=QR。</text></svg>