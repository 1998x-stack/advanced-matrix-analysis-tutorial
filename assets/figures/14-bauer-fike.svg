<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" role="img" aria-labelledby="bf-title bf-desc"><title id="bf-title">正规与非正规矩阵的特征值扰动容许区域</title><desc id="bf-desc">若 A=VΛV^{-1} 可对角化，Bauer-Fike 给任意扰动后的特征值与原谱的最小距离上界 κ2(V)||E||2。正规矩阵 V 可取酉矩阵，κ2(V)=1；非正规矩阵可能大于1。</desc><defs><marker id="bf-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="425" rx="18" fill="#f6faf8"/><rect x="27" y="70" width="412" height="308" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="482" y="70" width="410" height="308" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><text x="52" y="48" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#147f80">正规矩阵：κ₂(V)=1</text><text x="506" y="48" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#c66345">非正规可对角化：κ₂(V)&gt;1</text><path d="M54 248L411 248" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M85 347L85 111" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M507 248L863 248" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M535 347L535 111" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><circle cx="169" cy="248" r="31" fill="#e4f1ed" stroke="#147f80" stroke-width="3"/><circle cx="328" cy="248" r="31" fill="#e4f1ed" stroke="#147f80" stroke-width="3"/><circle cx="623" cy="248" r="87" fill="#fceade" stroke="#c66345" stroke-width="3"/><circle cx="776" cy="248" r="87" fill="#fceade" stroke="#c66345" stroke-width="3"/><circle cx="169" cy="248" r="5" fill="#147f80" stroke="#147f80" stroke-width="2"/><circle cx="328" cy="248" r="5" fill="#147f80" stroke="#147f80" stroke-width="2"/><circle cx="623" cy="248" r="5" fill="#c66345" stroke="#c66345" stroke-width="2"/><circle cx="776" cy="248" r="5" fill="#c66345" stroke="#c66345" stroke-width="2"/><text x="110" y="345" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">半径 = ‖E‖₂</text><text x="526" y="345" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#53676d">半径 = κ₂(V)‖E‖₂</text><text x="32" y="406" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">圆盘为定理上界示意、非真实谱轨迹；重叠不表示特征值一定合并。</text></svg>