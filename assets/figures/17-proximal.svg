<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="prox-title prox-desc"><title id="prox-title">投影与近端算子不是同一个操作</title><desc id="prox-desc">在一维例子中，梯度步得到 y=1.6；投影到区间 [0,1] 得到 1，而 L1 近端算子阈值 0.5 得到 1.1。</desc><defs><marker id="prox-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="18" fill="#f5f9f6"/><rect x="27" y="74" width="416" height="306" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="477" y="74" width="415" height="306" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><text x="50" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#147f80">投影梯度：回到可行集合</text><text x="501" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#c66345">近端梯度：处理非光滑惩罚</text><path d="M70 226L407 226" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M70 218L70 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M150 218L150 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M230 218L230 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M310 218L310 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M390 218L390 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><rect x="170" y="184" width="120" height="84" rx="2" fill="#e2f2ed" stroke="#147f80" stroke-width="1.5"/><text x="230" y="211" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">可行区间</text><text x="230" y="236" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#147f80">[0,1]</text><circle cx="355" cy="226" r="8" fill="#c66345" stroke="#c66345" stroke-width="2"/><text x="355" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#c66345">y=1.6</text><path d="M355 237L289 237" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" marker-end="url(#prox-arrow)"/><circle cx="289" cy="226" r="8" fill="#147f80" stroke="#147f80" stroke-width="2"/><text x="289" y="281" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">ΠC(y)=1</text><path d="M520 226L857 226" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M520 218L520 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M600 218L600 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M680 218L680 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M760 218L760 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><path d="M840 218L840 234" fill="none" stroke="#7d8d87" stroke-width="2" stroke-linecap="round"/><circle cx="817" cy="226" r="8" fill="#c66345" stroke="#c66345" stroke-width="2"/><text x="817" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#c66345">y=1.6</text><path d="M817 237L777 237" fill="none" stroke="#c66345" stroke-width="3" stroke-linecap="round" marker-end="url(#prox-arrow)"/><circle cx="777" cy="226" r="8" fill="#147f80" stroke="#147f80" stroke-width="2"/><text x="777" y="281" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">soft₀.₅(y)=1.1</text><text x="69" y="337" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">投影：minₓ∈C ½‖x−y‖²</text><text x="510" y="337" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">近端：minₓ ½‖x−y‖² + ηλ‖x‖₁</text><text x="31" y="412" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">右图软阈值 Sτ(y)=sign(y)·max(|y|−τ,0)；若换成核范数，近端算子就是逐奇异值软阈值 SVT。</text></svg>