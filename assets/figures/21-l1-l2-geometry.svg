<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="cs-title cs-desc"><title id="cs-title">ℓ1 球与解集相切于坐标轴，ℓ2 球切点不在坐标轴</title><desc id="cs-desc">左：最小 ℓ1 球是菱形，顶点在坐标轴上；与可行解集（直线）相切于顶点 (0,1)，对应 1-稀疏解。右：最小 ℓ2 球是圆；与同一条解集直线相切于 (0.4,0.8)，不在坐标轴上，对应非稀疏解。</desc><rect width="900" height="360" rx="14" fill="#fffdf9" stroke="#dce3df"/>
<line x1="70" y1="190" x2="350" y2="190" stroke="#dce3df" stroke-width="1.4"/>
<line x1="210" y1="60" x2="210" y2="320" stroke="#dce3df" stroke-width="1.4"/>
<polygon points="120,190 210,100 300,190 210,280" fill="#e8f4f2" stroke="#147f80" stroke-width="2"/>
<line x1="120" y1="55" x2="390" y2="190" stroke="#c66345" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="210" cy="100" r="5.5" fill="#c66345"/>
<text x="218" y="94" font-size="14" fill="#c66345" font-family="sans-serif">切点 (0,1)</text>
<text x="150" y="230" font-size="14" fill="#147f80" font-family="sans-serif">ℓ₁ 球（菱形）</text>
<text x="250" y="160" font-size="14" fill="#53676d" font-family="sans-serif">解集 Ax=y</text>
<text x="70" y="345" font-size="14" fill="#53676d" font-family="sans-serif">切点在坐标轴 → 稀疏</text>
<line x1="250" y1="60" x2="250" y2="320" stroke="#dce3df" stroke-width="1.4"/>
<circle cx="660" cy="190" r="80.5" fill="#efeaf8" stroke="#7461ba" stroke-width="2"/>
<line x1="570" y1="55" x2="840" y2="190" stroke="#c66345" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="696" cy="118" r="5.5" fill="#c66345"/>
<text x="704" y="112" font-size="14" fill="#c66345" font-family="sans-serif">切点 (0.4,0.8)</text>
<text x="600" y="235" font-size="14" fill="#7461ba" font-family="sans-serif">ℓ₂ 球（圆）</text>
<text x="560" y="100" font-size="14" fill="#53676d" font-family="sans-serif">同一条解集</text>
<text x="470" y="345" font-size="14" fill="#53676d" font-family="sans-serif">切点不在坐标轴 → 非稀疏</text></svg>
