<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="sylvester-title sylvester-desc"><title id="sylvester-title">Schur 变换将 Sylvester 方程化为三角回代</title><desc id="sylvester-desc">将 A、B 化为 Schur 形式并变换未知量，得到三角或准三角矩阵方程；可逐列/逐块回代，而不是构造巨大 Kronecker 矩阵。</desc><defs><marker id="sylvester-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="18" fill="#f5f9f6"/><rect x="25" y="73" width="272" height="302" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="324" y="73" width="272" height="302" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="623" y="73" width="272" height="302" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><text x="45" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">原矩阵方程</text><text x="344" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">Schur 坐标系</text><text x="643" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#c66345">结构化回代</text><rect x="58" y="126" width="207" height="61" rx="13" fill="#e6f1ed" stroke="#d5e2dc" stroke-width="1.5"/><text x="161" y="164" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#203035">AX + XB = C</text><path d="M161 190L161 215" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" marker-end="url(#sylv-arrow)"/><rect x="58" y="216" width="207" height="61" rx="13" fill="#f1f4f2" stroke="#d5e2dc" stroke-width="1.5"/><text x="161" y="254" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#53676d">未知矩阵 X</text><rect x="358" y="112" width="205" height="60" rx="13" fill="#e6f1ed" stroke="#d5e2dc" stroke-width="1.5"/><text x="460" y="149" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#203035">A=QₐTₐQₐᵀ</text><rect x="358" y="190" width="205" height="60" rx="13" fill="#e6f1ed" stroke="#d5e2dc" stroke-width="1.5"/><text x="460" y="227" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#203035">B=QᵦTᵦQᵦᵀ</text><path d="M460 256L460 277" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" marker-end="url(#sylv-arrow)"/><text x="460" y="311" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#c66345">TₐY + YTᵦ = F</text><rect x="655" y="116" width="205" height="58" rx="13" fill="#f1f6f3" stroke="#d5e2dc" stroke-width="1.5"/><rect x="655" y="190" width="205" height="58" rx="13" fill="#f1f6f3" stroke="#d5e2dc" stroke-width="1.5"/><rect x="655" y="264" width="205" height="58" rx="13" fill="#eeeafb" stroke="#d5e2dc" stroke-width="1.5"/><text x="675" y="151" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#203035">①  解第 1 个列块</text><text x="675" y="225" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#203035">②  更新右端并回代</text><text x="675" y="299" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#203035">③  恢复 X=QₐYQᵦᵀ</text><text x="45" y="338" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">先变换坐标，再利用三角结构</text><text x="645" y="338" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">避开 mn×mn 稠密系统</text><text x="31" y="414" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">唯一解条件：σ(A)∩(−σ(B))=∅；若谱和接近零，方程可能病态，即使唯一也不稳定。</text></svg>