<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="nmfupdates-title nmfupdates-desc"><title id="nmfupdates-title">NMF 乘性更新与尺度不唯一性</title><desc id="nmfupdates-desc">固定 W 更新 H，再固定新 H 更新 W；经典 Frobenius 乘性规则在其假设下使目标不增，但联合问题仍非凸且因子不唯一。</desc><defs><marker id="nmfupdates-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="430" rx="18" fill="#f5f9f6"/><rect x="25" y="73" width="272" height="302" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="324" y="73" width="272" height="302" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><rect x="623" y="73" width="272" height="302" rx="13" fill="#fff" stroke="#d5e2dc" stroke-width="1.5"/><text x="45" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">交替乘性更新</text><text x="344" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#c66345">误差轨迹（示意）</text><text x="643" y="49" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">等价因子变换</text><rect x="57" y="115" width="208" height="60" rx="13" fill="#e5f1ec" stroke="#d5e2dc" stroke-width="1.5"/><text x="161" y="151" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#203035">H ← H ⊙ (WᵀV)/(WᵀWH)</text><path d="M161 177L161 197" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" marker-end="url(#nmfu-arrow)"/><rect x="57" y="199" width="208" height="60" rx="13" fill="#f8e8df" stroke="#d5e2dc" stroke-width="1.5"/><text x="161" y="235" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#203035">W ← W ⊙ (VHᵀ)/(WHHᵀ)</text><path d="M161 261L161 281" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" marker-end="url(#nmfu-arrow)"/><text x="161" y="310" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#53676d">重复至停止条件</text><path d="M358 140 L410 191 L462 224 L514 248 L566 262" fill="none" stroke="#147f80" stroke-width="4"/><path d="M355 278L567 278" fill="none" stroke="#a7b8b0" stroke-width="2" stroke-linecap="round"/><text x="355" y="116" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#53676d">½‖V−WH‖F²</text><text x="359" y="311" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">迭代次数 →</text><rect x="652" y="123" width="214" height="72" rx="13" fill="#e5f1ec" stroke="#d5e2dc" stroke-width="1.5"/><text x="759" y="152" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203035">W′=WD</text><text x="759" y="178" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203035">H′=D⁻¹H</text><text x="759" y="222" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#147f80">W′H′=WH</text><rect x="652" y="251" width="214" height="63" rx="13" fill="#eeeafb" stroke="#d5e2dc" stroke-width="1.5"/><text x="759" y="277" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#7461ba">列/行同时置换</text><text x="759" y="300" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#7461ba">乘积仍不变</text><text x="42" y="346" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">初始化非负可保持非负；分母为零要处理</text><text x="340" y="346" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">真实损失需实算；此曲线只画单调趋势</text><text x="642" y="346" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">正对角 D&gt;0；另有置换自由度</text><text x="30" y="414" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">零元素可能被乘性规则锁定；加 ε 稳定分母是工程改动，不可不加说明地套用原始单调性证明。</text></svg>