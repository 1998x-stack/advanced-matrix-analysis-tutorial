<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" role="img" aria-labelledby="svd-title svd-desc"><title id="svd-title">SVD 的三个连续几何作用：正交换基、伸缩、正交映回</title><desc id="svd-desc">示例 A=[[2,1],[1,2]]，奇异值 3 和 1。输入单位圆经 A 映为沿 45 度方向延伸的椭圆，可写作 U Σ V 的转置的连乘。</desc><defs><marker id="svd-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#147f80" stroke-width="1.5"/></marker></defs><rect width="920" height="425" rx="18" fill="#f6faf8"/><text x="30" y="44" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035">A = U Σ Vᵀ：先换到右奇异基，再独立伸缩，最后映射到左奇异基</text><rect x="22" y="83" width="202" height="290" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="247" y="83" width="202" height="290" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="472" y="83" width="202" height="290" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><rect x="697" y="83" width="202" height="290" rx="12" fill="#fff" stroke="#d1e0d9" stroke-width="1.4"/><text x="37" y="121" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#203035">输入 x</text><text x="262" y="121" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#203035">Vᵀ：方向坐标</text><text x="487" y="121" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#203035">Σ：轴向伸缩</text><text x="712" y="121" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#203035">U：输出 Ax</text><path d="M41 250L205 250" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M123 334L123 166" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><circle cx="123" cy="250" r="46" fill="#e8f5f1" stroke="#147f80" stroke-width="2"/><path d="M266 250L430 250" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M348 334L348 166" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><circle cx="348" cy="250" r="46" fill="#e8f5f1" stroke="#147f80" stroke-width="2"/><path d="M491 250L655 250" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M573 334L573 166" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><ellipse cx="573" cy="250" rx="78" ry="26" fill="#fbe8dd" stroke="#c66345" stroke-width="3"/><path d="M716 250L880 250" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M798 334L798 166" stroke="#b5cac4" stroke-width="2" stroke-linecap="round" fill="none" /><ellipse cx="798" cy="250" rx="78" ry="26" transform="rotate(-45 798 250)" fill="#fbe8dd" stroke="#c66345" stroke-width="3"/><path d="M224 246L246 246" stroke="#147f80" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#svd-arrow)"/><path d="M449 246L471 246" stroke="#147f80" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#svd-arrow)"/><path d="M674 246L696 246" stroke="#147f80" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#svd-arrow)"/><text x="38" y="352" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">‖x‖₂=1</text><text x="260" y="352" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#53676d">单位圆外形不变</text><text x="482" y="352" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#c66345">σ₁=3，σ₂=1</text><text x="704" y="352" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#c66345">椭圆主轴旋转</text><text x="27" y="407" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#53676d">本例 U=V 为 45° 特征基；对任意矩形 A，SVD 中左右奇异向量可以位于不同维空间。</text></svg>