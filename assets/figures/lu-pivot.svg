<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="pivot-title pivot-desc"><title id="pivot-title">部分主元交换避免零主元</title><desc id="pivot-desc">矩阵 A=[[0,2],[1,3]] 第一主元为零；先交换两行得到 PA=[[1,3],[0,2]]，再有 PA=LU。</desc><rect width="920" height="420" rx="18" fill="#f6faf8"/><text x="33" y="45" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#203035">首个主元为零：先交换两行，才能使用消元分解。</text><rect x="28" y="74" width="252" height="294" rx="12" fill="#fff" stroke="#d6e1dc"/><rect x="336" y="74" width="251" height="294" rx="12" fill="#fff" stroke="#d6e1dc"/><rect x="646" y="74" width="244" height="294" rx="12" fill="#fff" stroke="#d6e1dc"/><text x="49" y="113" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#203035">原矩阵 A</text><text x="358" y="113" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#203035">行交换 PA</text><text x="662" y="113" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#203035">上三角 U</text><rect x="64" y="138" width="68" height="62" rx="12" fill="#fbe9df" stroke="#d6e1dc"/><text x="89" y="178" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#c66345">0</text><rect x="143" y="138" width="68" height="62" rx="12" fill="#e9f3ee" stroke="#d6e1dc"/><text x="168" y="178" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#203035">2</text><rect x="64" y="211" width="68" height="62" rx="12" fill="#e9f3ee" stroke="#d6e1dc"/><text x="89" y="251" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#203035">1</text><rect x="143" y="211" width="68" height="62" rx="12" fill="#e9f3ee" stroke="#d6e1dc"/><text x="168" y="251" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#203035">3</text><rect x="374" y="138" width="68" height="62" rx="12" fill="#e9f3ee" stroke="#d6e1dc"/><text x="399" y="178" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#203035">1</text><rect x="453" y="138" width="68" height="62" rx="12" fill="#e9f3ee" stroke="#d6e1dc"/><text x="478" y="178" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#203035">3</text><rect x="374" y="211" width="68" height="62" rx="12" fill="#e9f3ee" stroke="#d6e1dc"/><text x="399" y="251" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#203035">0</text><rect x="453" y="211" width="68" height="62" rx="12" fill="#e9f3ee" stroke="#d6e1dc"/><text x="478" y="251" font-family="Arial,'PingFang SC',sans-serif" font-size="25" fill="#203035">2</text><path d="M286,213L328,213" fill="none" stroke="#147f80" stroke-width="3"/><path d="M593,213L638,213" fill="none" stroke="#147f80" stroke-width="3"/><text x="673" y="169" font-family="Arial,'PingFang SC',sans-serif" font-size="24" fill="#7461ba">L=I</text><text x="673" y="232" font-family="Arial,'PingFang SC',sans-serif" font-size="24" fill="#147f80">U=PA</text><text x="47" y="331" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#c66345">0 不能作除数</text><text x="349" y="331" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53676d">P=[[0,1],[1,0]]</text><text x="665" y="331" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53676d">不需要消元</text><text x="33" y="397" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53676d">主元很小时仍可能扩大舍入误差；部分主元选取是数值计算的关键步骤。</text></svg>